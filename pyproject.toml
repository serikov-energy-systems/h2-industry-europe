[project]
name = "h2ind"
version = "0.1.0"
description = "Regional pathways for steel and ammonia decarbonisation and the hydrogen they need (research study, stylised regions)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
